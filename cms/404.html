<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-fC9RKw5/PxxmvqghqXONYWYB1QXVWOxlWqON+Cnm/Mc='; base-uri 'none'; form-action 'none'"><title>設備技研｜ページを開く</title></head><body><main><h1>設備技研</h1><p>管理画面は、ログイン後に開けます。</p><a id="home" href="./">入口を開く</a></main><script>(() => {
  const repo = '/setsubigiken-cms-review/';
  const base = location.pathname.startsWith(repo) ? repo : '/';
  const relative = location.pathname.slice(base.length);
  const area = relative.startsWith('cms/') ? 'cms/' : relative.startsWith('review/') ? 'review/' : '';
  const home = new URL(base + area, location.origin);
  document.getElementById('home').href = home.href;
  const inner = relative.slice(area.length);
  const match = inner.match(/^app\/(matayoshi|gibo|taira)\/[^?#]+\.html$/);
  if (match) home.searchParams.set('next', location.pathname + location.search);
  if (match || (area === 'cms/' && inner.startsWith('preview/'))) location.replace(home.href);
})();</script></body></html>
